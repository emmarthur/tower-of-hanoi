<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower of Hanoi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">🥏</div>
        <h1>Tower of Hanoi</h1>
        <p class="tagline">Move the stack to tower B or C — one disk at a time, no large on small</p>
      </header>

      <section class="card status-card" aria-live="polite">
        <p id="stats-text" class="stats-text">Moves: 0</p>
        <p id="result-text" class="result-text" hidden></p>
        <p id="error-text" class="error" role="alert" hidden></p>
        <button type="button" id="btn-new" class="btn btn-secondary">New puzzle</button>
      </section>

      <section class="board" id="board" aria-label="Towers"></section>

      <section class="card moves-card">
        <p class="moves-hint" id="move-hint">Select a source tower, then a destination.</p>
        <div class="tower-buttons" id="tower-buttons">
          <button type="button" class="tower-btn" data-tower="A">Tower A</button>
          <button type="button" class="tower-btn" data-tower="B">Tower B</button>
          <button type="button" class="tower-btn" data-tower="C">Tower C</button>
        </div>
      </section>
    </main>

    <script src="/static/session-persist.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
